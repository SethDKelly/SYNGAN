name: 007-C Controlled Lock Materialization

on:
  push:
    branches: [phase-007-c-source-topology]
    paths-ignore:
      - uv.lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-verify-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-topology branch
        uses: actions/checkout@v7.0.1
        with:
          ref: phase-007-c-source-topology

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Resolve updated lockfile
        run: uv lock

      - name: Provision locked environment and install SYNGAN
        run: uv sync --all-groups --locked --no-build-isolation

      - name: Run repository verification gates
        run: uv run --no-sync python tools/verify.py all

      - name: Verify uv.lock is the only repository change
        shell: bash
        run: |
          git diff --exit-code -- . ':!uv.lock'
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Materialize verified lockfile
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          test "$(git diff --cached --name-only)" = "uv.lock"
          git commit -m "007-C materialize verified uv lock"
          git push origin HEAD:phase-007-c-source-topology
