name: 007-B Bootstrap Lock

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Resolve lockfile
        run: uv lock

      - name: Provision locked verification environment
        run: uv sync --all-groups --no-install-project --locked

      - name: Run repository verification gates
        run: uv run --no-sync python tools/verify.py all

      - name: Retain generated lockfile
        uses: actions/upload-artifact@v7.0.1
        with:
          name: syngan-007-b-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 7
