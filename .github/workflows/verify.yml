name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Provision locked tool and test environment
        run: uv sync --all-groups --no-install-project --locked

      - name: Install SYNGAN with provisioned build backend
        run: uv sync --all-groups --locked --no-build-isolation

      - name: Run required portable verification gate
        run: uv run --no-sync python tools/verify.py portable

      - name: Run required control persistence gate
        run: uv run --no-sync python tools/verify.py control

      - name: Run required distributed data-state gate
        run: uv run --no-sync python tools/verify.py data

      - name: Run required Strategy runtime and Learned-State gate
        run: uv run --no-sync python tools/verify.py runtime

      - name: Run required Execution and recovery gate
        run: uv run --no-sync python tools/verify.py execution

      - name: Run required Evaluation Evidence and history gate
        run: uv run --no-sync python tools/verify.py evidence

      - name: Run required authorization disclosure and no-egress gate
        run: uv run --no-sync python tools/verify.py security

      - name: Run required platform portability and qualification gate
        run: uv run --no-sync python tools/verify.py platform

      - name: Run required cross-slice adversarial integration gate
        run: uv run --no-sync python tools/verify.py cross-slice
