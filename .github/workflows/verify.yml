name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Provision locked verification environment
        run: uv sync --all-groups --no-install-project --locked

      - name: Run repository verification gates
        run: uv run --no-sync python tools/verify.py all
