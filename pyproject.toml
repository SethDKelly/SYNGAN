[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "syngan"
version = "0.0.0"
description = "Spark-native, model-neutral synthetic data generation framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
build = [
  "hatchling>=1.27,<2",
  "editables>=0.6,<1",
]
test = [
  "hypothesis>=6.130,<7",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "pytest-socket>=0.7,<1",
]
lint = [
  "ruff>=0.12,<1",
]
type = [
  "mypy>=1.17,<2",
]
fitness = [
  "import-linter>=2.3,<3",
]
dev = [
  { include-group = "build" },
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "type" },
  { include-group = "fitness" },
]

[tool.uv]
required-version = ">=0.12,<0.13"
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/syngan"]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--disable-socket",
]
testpaths = ["tests"]
markers = [
  "network: explicitly permits network access; never part of portable-core verification",
  "spark: requires a Spark/local-distributed runtime profile; introduced only by later authority",
  "integration: exercises an explicitly provisioned integration profile",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
pretty = true
warn_unreachable = true
exclude = ["^docs/"]

[tool.importlinter]
root_package = "syngan"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "core-layers"
name = "Core package dependencies point inward"
type = "layers"
layers = [
  "syngan.api",
  "syngan.application",
  "syngan.ports",
  "syngan.domain",
  "syngan.foundation",
]

[[tool.importlinter.contracts]]
id = "core-no-outer-dependencies"
name = "Core packages do not depend on adapters or bootstrap"
type = "forbidden"
source_modules = [
  "syngan.foundation",
  "syngan.domain",
  "syngan.ports",
  "syngan.application",
  "syngan.api",
]
forbidden_modules = [
  "syngan.adapters",
  "syngan.bootstrap",
]

[[tool.importlinter.contracts]]
id = "adapters-stay-outside-coordination"
name = "Adapters do not depend on coordination or composition"
type = "forbidden"
source_modules = ["syngan.adapters"]
forbidden_modules = [
  "syngan.application",
  "syngan.api",
  "syngan.bootstrap",
]

[tool.coverage.run]
branch = true
parallel = false
source = ["src/syngan", "tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
